<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fde4ef;
      font-family: "Courier New", monospace;
      font-weight: bold;
      text-align: center;
    }
    .machine {
      width: 420px;
      background: #ffd1e6;
      border: 6px solid #ff8fc0;
      box-shadow: 8px 8px 0 #7b6cd9;
    }
    .sign {
      background: #fff0f7;
      border-bottom: 6px solid #ff8fc0;
      padding: 12px;
      font-size: 56px;
      color: #8fd3ff;
      text-shadow: 3px 3px 0 #5a7be0, 6px 6px 0 #f7e98b;
    }
    .glass {
      position: relative;
      height: 220px;
      background: #b8ecff;
      border-bottom: 6px solid #ff8fc0;
      overflow: hidden;
    }
    .rope {
      position: absolute;
      left: 50%;
      top: 0;
      width: 6px;
      height: 60px;
      background: #5a7be0;
      animation: swing 2s ease-in-out infinite alternate;
    }
    .claw {
      position: absolute;
      left: -17px;
      bottom: -24px;
      width: 40px;
      height: 24px;
      border: 6px solid #5a7be0;
      border-top: none;
      border-radius: 0 0 20px 20px;
    }
    @keyframes swing {
      from { transform: translateX(-60px); }
      to { transform: translateX(60px); }
    }
    .toys {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
    }
    .toy {
      width: 70px;
      height: 60px;
      border: 4px solid #5a4a8a;
      border-radius: 30px 30px 10px 10px;
    }
    .pink { background: #ffb3d1; }
    .yellow { background: #fff1a8; height: 75px; }
    .mint { background: #b5f5c8; }
    .lilac { background: #d9c8ff; height: 70px; }
    .panel {
      padding: 16px;
      color: #7b6cd9;
    }
    .panel h1 {
      margin: 0;
      font-size: 48px;
      color: #ff6fae;
      text-shadow: 3px 3px 0 #fff;
    }
    .panel p {
      margin: 8px 0;
      font-size: 18px;
    }
    .buttons span {
      display: inline-block;
      width: 40px;
      height: 20px;
      margin: 6px;
      background: #ffcf8a;
      border: 4px solid #e07a3c;
      border-radius: 50%;
    }
    a {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 18px;
      background: #8fd3ff;
      color: #3b3b8f;
      border: 4px solid #5a7be0;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="sign">404</div>
    <div class="glass">
      <div class="rope"><div class="claw"></div></div>
      <div class="toys">
        <div class="toy pink"></div>
        <div class="toy yellow"></div>
        <div class="toy mint"></div>
        <div class="toy lilac"></div>
      </div>
    </div>
    <div class="panel">
      <h1>Oops!</h1>
      <p>Ceci n'est pas une page</p>
      <p>The claw missed... this page was not caught.</p>
      <div class="buttons"><span></span><span></span><span></span></div>
      <a href="/">Try again</a>
    </div>
  </div>
</body>
</html>
